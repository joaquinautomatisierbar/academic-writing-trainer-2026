name: Expire question bank

on:
  schedule:
    - cron: "0 18 25 9 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.run_started_at, '2026-09-25')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the published branch with the expired page
        run: |
          cp expired.html /tmp/expired.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan expired-publication
          git rm -rf .
          cp /tmp/expired.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          git commit -m "chore: expire academic writing trainer"
          git push --force origin HEAD:gh-pages
